version: 0.2

phases:
  pre_build:
    commands:
      - cd ./hello-app
      - echo Installing python packages...
      - python -m venv .venv
      - . .venv/bin/activate
      - python -m pip install -r requirements.txt pytest
  build:
    commands:
      - echo run tests...
      - python -m pytest --junitxml=pytest_reports/junit.xml

reports:
  pytest_reports:
    files:
      - junit.xml
    base-directory: ./hello-app/pytest_reports
    file-format: JUNITXML

